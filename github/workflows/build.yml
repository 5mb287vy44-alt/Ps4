name: Build PS4 PKG

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # PkgTool.Core is an old .NET app: let it run on the newer runtime of the runner
      DOTNET_ROLL_FORWARD: Major
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install clang and lld
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld

      - name: Download OpenOrbis toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/oo" && cd "$HOME/oo"
          gh release download v0.5.4 --repo OpenOrbis/OpenOrbis-PS4-Toolchain --pattern '*.tar.gz' \
            || gh release download v0.5.4 --repo OpenOrbis/OpenOrbis-PS4-Toolchain --pattern '*.zip'
          for f in *.tar.gz; do [ -e "$f" ] && tar -xzf "$f"; done || true
          for f in *.zip; do [ -e "$f" ] && unzip -q "$f"; done || true
          LINK="$(find "$HOME/oo" -name link.x -print -quit)"
          test -n "$LINK" || { echo "link.x not found, toolchain layout changed"; ls -R "$HOME/oo" | head -50; exit 1; }
          echo "OO_PS4_TOOLCHAIN=$(dirname "$LINK")" >> "$GITHUB_ENV"
          echo "Toolchain at: $(dirname "$LINK")"

      - name: Build PKG
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonSnake-pkg
          path: "*.pkg"

      - name: Publish to Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Neon Snake build ${{ github.run_number }}
          files: "*.pkg"
